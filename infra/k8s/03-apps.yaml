# -------------------------------------------------------------
# IAM SERVICE
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-iam-service
  namespace: integracentro-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-iam-service
  template:
    metadata:
      labels:
        app: ic-iam-service
    spec:
      containers:
        - name: iam-service
          image: ghcr.io/rickrgr-22/ic-iam-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ic-app-config
            - secretRef:
                name: ic-db-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              memory: 256Mi
              cpu: 250m

---
apiVersion: v1
kind: Service
metadata:
  name: ic-iam-service
  namespace: integracentro-prod
spec:
  selector:
    app: ic-iam-service
  ports:
    - port: 3000
      targetPort: 3000

---
