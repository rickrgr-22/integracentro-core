apiVersion: v1
kind: ConfigMap
metadata:
  name: ic-db-migration-script
  namespace: integracentro-prod
data:
  init.sql: |
    -- Esquema transaccional base IntegraCentro
    CREATE TABLE IF NOT EXISTS usuarios_rbac (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) UNIQUE NOT NULL,
        rol VARCHAR(50) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS centros_estancia (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        nombre VARCHAR(255) NOT NULL,
        registro_sanitario VARCHAR(100) UNIQUE,
        estatus VARCHAR(50) DEFAULT 'EN_REVISION',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS expedientes_evidencias (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        centro_id UUID REFERENCES centros_estancia(id),
        ruta_archivo TEXT NOT NULL,
        hash_sha256 VARCHAR(64) NOT NULL,
        valido BOOLEAN DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Datos semilla idempotentes
    INSERT INTO usuarios_rbac (email, rol)
    VALUES ('admin@integracentro.local', 'ADMIN_SUPERVISOR')
    ON CONFLICT (email) DO NOTHING;

    INSERT INTO centros_estancia (nombre, registro_sanitario, estatus)
    VALUES ('Centro Modelo Querétaro', 'REG-QRO-001', 'CERTIFICADO')
    ON CONFLICT (registro_sanitario) DO NOTHING;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ic-db-migration-job
  namespace: integracentro-prod
spec:
  ttlSecondsAfterFinished: 180
  backoffLimit: 4
  template:
    metadata:
      name: ic-db-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Esperando que ic-postgres este disponible..."
              until pg_isready -h ic-postgres -p 5432 -U ic_admin; do
                sleep 2
              done
              echo "PostgreSQL activo."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ic-db-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Iniciando aplicacion de esquema SQL..."
              psql -h ic-postgres -p 5432 -U ic_admin -d integracentro_db -v ON_ERROR_STOP=1 -f /scripts/init.sql
              echo "Migracion finalizada con exito."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ic-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migration-script-volume
              mountPath: /scripts
      volumes:
        - name: migration-script-volume
          configMap:
            name: ic-db-migration-script