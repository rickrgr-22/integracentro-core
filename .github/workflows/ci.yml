name: IntegraCentro CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos requeridos para publicar en GHCR
permissions:
  contents: read
  packages: write

jobs:
  validate-infra:
    name: Validar Terraform y Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validar configuracion de Terraform
        run: |
          cd infra/terraform/local-minikube
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Validar sintaxis de Ansible Playbooks
        run: |
          pip install ansible
          ansible-playbook --syntax-check infra/ansible/playbooks/verify_deployment.yml

  build-and-push-ghcr:
    name: Build & Push a GHCR
    runs-on: ubuntu-latest
    needs: validate-infra
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam-service
          - scoring-engine
          - vault-manager
          - pwa-client

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Habilita emulación para compilar binarios ARM64 en runners x86_64
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas y metadatos Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ic-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Compilar y publicar imagen multi-arquitectura
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max